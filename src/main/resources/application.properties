spring.application.name=api-inteligente-budget
server.port=${SERVER_PORT:8080}

# H2 deixa a aplicação executável localmente sem infraestrutura adicional.
spring.datasource.url=${DB_URL:jdbc:h2:mem:budget;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# A chave é opcional para iniciar a API; chamadas de IA exigem OPENAI_API_KEY.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.audio.transcription.language=pt
spring.ai.openai.audio.speech.voice=nova
spring.ai.openai.audio.speech.response-format=mp3

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
